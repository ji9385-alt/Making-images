<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사진 문구 넣기</title>
<style>
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --ink: #1c1f1a;
  --muted: #6a7066;
  --line: #dcdfd8;
  --field: #f7f8f5;
  --accent: #7ed957;
  --accent-ink: #1f3d10;
  --stage: #e6e8e2;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161815; --panel: #1f221e; --ink: #eceee9; --muted: #9aa094;
    --line: #333830; --field: #262a25; --accent: #8fe066; --accent-ink: #10220a;
    --stage: #121411; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161815; --panel: #1f221e; --ink: #eceee9; --muted: #9aa094;
  --line: #333830; --field: #262a25; --accent: #8fe066; --accent-ink: #10220a;
  --stage: #121411; color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
  font-size: 15px; line-height: 1.5;
}
.app {
  display: grid; grid-template-columns: minmax(0, 1fr) 340px;
  gap: 20px; max-width: 1280px; margin: 0 auto; padding: 20px;
  min-height: 100vh;
}
.stage {
  background: var(--stage); border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  padding: 20px; min-height: 420px; position: relative;
}
canvas {
  max-width: 100%; max-height: calc(100vh - 80px); display: block;
  border-radius: 4px; touch-action: none; cursor: grab;
  box-shadow: 0 2px 18px rgba(0,0,0,.18);
}
canvas.dragging { cursor: grabbing; }
.empty {
  text-align: center; color: var(--muted); border: 2px dashed var(--line);
  border-radius: 12px; padding: 48px 28px; width: min(420px, 100%);
}
.empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
.stage.over .empty { border-color: var(--accent); }
.hint {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
  font-size: 12px; color: var(--muted); white-space: nowrap;
}
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; align-self: start; position: sticky; top: calc(20px + env(safe-area-inset-top, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
h1 { font-size: 18px; margin: 0; font-weight: 700; }
.group { display: flex; flex-direction: column; gap: 10px; }
.group + .group { border-top: 1px solid var(--line); padding-top: 18px; }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
input[type=text] {
  font: inherit; color: var(--ink); background: var(--field);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%;
}
input[type=text]:focus-visible, button:focus-visible, input[type=range]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
.row { display: flex; gap: 8px; align-items: center; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: 1; }
.seg button {
  flex: 1; font: inherit; font-size: 13px; padding: 7px 0; border: 0;
  background: var(--field); color: var(--ink); cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.range { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.range span { display: flex; justify-content: space-between; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.btn {
  font: inherit; font-weight: 700; border-radius: 8px; padding: 11px 14px;
  border: 1px solid var(--line); background: var(--field); color: var(--ink); cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.small { font-size: 12px; color: var(--muted); margin: 0; }
#status:empty { display: none; }
input[type=file] {
  position: absolute; width: 1px; height: 1px; opacity: 0;
  overflow: hidden; clip: rect(0 0 0 0); pointer-events: none;
}
label.btn { display: block; text-align: center; }
#pick:focus-visible, #ovpick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#ovctl { display: flex; flex-direction: column; gap: 10px; }
#ovctl[hidden] { display: none; }
.row .btn { flex: 1; }
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; padding: 12px; }
  .panel { position: static; }
  .stage { min-height: 260px; padding: 12px; }
  canvas { max-height: 60vh; }
}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <div class="empty" id="empty">
      <strong>사진을 올려주세요</strong>
      여기로 끌어다 놓거나, 오른쪽 ‘사진 선택’을 누르세요.
    </div>
    <canvas id="cv" hidden aria-label="문구가 들어간 사진 미리보기"></canvas>
    <div class="hint" id="hint" hidden>문구나 추가 이미지를 드래그해서 옮길 수 있어요</div>
  </div>

  <aside class="panel">
    <h1>사진 문구 넣기</h1>

    <div class="group">
      <label class="btn" for="file" id="pick" role="button" tabindex="0">사진 선택</label>
      <input type="file" id="file" accept="image/*">
    </div>

    <div class="group">
      <label class="btn" for="ovfile" id="ovpick" role="button" tabindex="0">이미지 추가</label>
      <input type="file" id="ovfile" accept="image/*">
      <div id="ovctl" hidden>
        <label class="range"><span>이미지 크기<output id="ovSizeOut">25%</output></span>
          <input type="range" id="ovsize" min="5" max="100" value="25"></label>
        <div class="row">
          <button class="btn" id="ovreset">상단 가운데로</button>
          <button class="btn" id="ovremove">이미지 빼기</button>
        </div>
        <p class="small">추가한 이미지를 드래그하면 그 이미지만 움직여요.</p>
      </div>
    </div>

    <div class="group">
      <label class="field">소제목<input type="text" id="kicker" value="소제목"></label>
      <label class="field">제목<input type="text" id="title" value="제목을 입력하세요"></label>
      <label class="field">부제<input type="text" id="subtitle" value="부제를 입력하세요"></label>
      <label class="field">이름<input type="text" id="name" value="홍길동"></label>
      <p class="small">비워둔 항목은 구분선과 함께 빠져요.</p>
    </div>

    <div class="group">
      <div class="row">
        <div class="seg" role="group" aria-label="정렬">
          <button data-align="left" aria-pressed="false">왼쪽</button>
          <button data-align="center" aria-pressed="true">가운데</button>
          <button data-align="right" aria-pressed="false">오른쪽</button>
        </div>
      </div>
      <label class="range"><span>글자 크기<output id="sizeOut">100%</output></span>
        <input type="range" id="size" min="50" max="200" value="100"></label>
      <label class="range"><span>세로 위치<output id="yOut">하단</output></span>
        <input type="range" id="ypos" min="0" max="100" value="94"></label>
      <button class="btn" id="reset">하단 기본 위치로</button>
    </div>

    <div class="group">
      <button class="btn primary" id="save" disabled>이미지 저장 (PNG)</button>
      <p class="small" id="status" role="status"></p>
    </div>
  </aside>
</div>

<script>
(() => {
  const FONT = '"Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif';
  const GREEN = '#7ED957';
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  const stage = $('stage'), empty = $('empty'), hint = $('hint');
  const fields = { kicker: $('kicker'), title: $('title'), subtitle: $('subtitle'), name: $('name') };
  const sizeEl = $('size'), yEl = $('ypos'), saveBtn = $('save'), statusEl = $('status');

  let img = null, fileBase = 'photo';
  // pos.x: 0..1 anchor x; pos.y: 0..1 bottom of text block
  const DEFAULT = { x: 0.5, y: 0.94 };
  let pos = { ...DEFAULT };
  let align = 'center';
  // 추가 이미지: x = 가로 중심, y = 위쪽 끝 (사진 대비 비율)
  const OV_DEFAULT = { x: 0.5, y: 0.05 };
  let overlay = null, ov = { ...OV_DEFAULT }, ovRect = null;

  // Fonts
  const fontsReady = Promise.resolve();
  fontsReady.then(draw);

  function layout(W) {
    const s = Number(sizeEl.value) / 100;
    const base = W * s;
    const parts = [];
    const t = fields.title.value.trim(), st = fields.subtitle.value.trim(), n = fields.name.value.trim();
    if (t) parts.push({ key: 'title', text: t, size: base * 0.062 });
    if (st) parts.push({ key: 'subtitle', text: st, size: base * 0.040 });
    if (n) parts.push({ key: 'name', text: n, size: base * 0.032 });
    const k = fields.kicker.value.trim();
    const kicker = k ? { text: k, size: Math.max(14, base * 0.036) } : null;
    return { parts, kicker, base };
  }

  const hasLS = 'letterSpacing' in CanvasRenderingContext2D.prototype;
  function setLS(px) { if (hasLS) ctx.letterSpacing = px + 'px'; }

  // 얇은 테두리 + 은은한 그림자로 선명하게
  function outlined(text, x, y, size) {
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = size * 0.2;
    ctx.shadowOffsetY = size * 0.04;
    ctx.lineWidth = Math.max(1.5, size * 0.06);
    ctx.strokeStyle = '#000';
    ctx.strokeText(text, x, y);
    ctx.restore();
    ctx.fillStyle = '#fff';
    ctx.fillText(text, x, y);
  }

  function draw() {
    if (!img) return;
    const W = img.width, H = img.height;
    if (cv.width !== W) cv.width = W;
    if (cv.height !== H) cv.height = H;
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(img, 0, 0, W, H);

    ovRect = null;
    if (overlay) {
      const ow = W * Number($('ovsize').value) / 100;
      const oh = ow * overlay.height / overlay.width;
      let ox = ov.x * W - ow / 2, oy = ov.y * H;
      if (ow < W) ox = Math.min(Math.max(ox, 0), W - ow);
      if (oh < H) oy = Math.min(Math.max(oy, 0), H - oh);
      ctx.drawImage(overlay, ox, oy, ow, oh);
      ovRect = { x: ox, y: oy, w: ow, h: oh };
    }

    const { parts, kicker, base } = layout(Math.min(W, H * 1.4));
    if (!parts.length && !kicker) return;

    // measure
    let maxW = 0;
    parts.forEach(p => {
      ctx.font = `700 ${p.size}px ${FONT}`;
      p.w = ctx.measureText(p.text).width;
      p.h = p.size * 1.18;
      maxW = Math.max(maxW, p.w);
    });
    const gap = base * 0.016;          // space above/below divider
    const lineH = Math.max(2, base * 0.0042); // divider thickness
    // 제목과 부제 사이에는 구분선 없음
    const hasDiv = i => !(parts[i].key === 'title' && parts[i + 1].key === 'subtitle');
    const tightGap = gap * 0.5;
    let total = 0;
    parts.forEach((p, i) => { total += p.h; if (i < parts.length - 1) total += hasDiv(i) ? gap * 2 + lineH : tightGap; });

    // 구분선 길이는 제목·부제·이름 중 가장 긴 텍스트에만 맞춤
    const mainW = maxW;
    let kick = null;
    const kickGap = parts.length ? gap * 0.6 : 0;
    if (kicker) {
      ctx.font = `700 ${kicker.size}px ${FONT}`;
      setLS(kicker.size * 0.08);
      const kw = ctx.measureText(kicker.text).width;
      setLS(0);
      const pad = kicker.size * 0.6;
      const lineLen = Math.max(kicker.size * 1.1, ((mainW - kw) / 2 - pad) * 0.7);
      maxW = Math.max(maxW, kw + 2 * (pad + lineLen));
      kick = { ...kicker, w: kw, pad, lineLen, h: kicker.size * 1.18 };
      total += kick.h + kickGap;
    }
    const divW = mainW;

    const margin = W * 0.04;
    let ax = pos.x * W;
    // keep block inside picture
    const half = maxW / 2;
    if (align === 'center') ax = Math.min(Math.max(ax, half + margin), W - half - margin);
    if (align === 'left') ax = Math.min(Math.max(ax, margin), W - maxW - margin);
    if (align === 'right') ax = Math.min(Math.max(ax, maxW + margin), W - margin);
    let bottom = Math.min(Math.max(pos.y * H, total + margin), H - margin * 0.5);
    let y = bottom - total;

    const blockLeft = align === 'left' ? ax : align === 'right' ? ax - maxW : ax - half;
    const divLeft = align === 'left' ? ax : align === 'right' ? ax - mainW : ax - mainW / 2;

    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;

    if (kick) {
      ctx.font = `700 ${kick.size}px ${FONT}`;
      const cy = y + kick.h / 2;
      const cx = blockLeft + maxW / 2;
      ctx.textAlign = 'center';
      setLS(kick.size * 0.08);
      outlined(kick.text, cx, cy, kick.size);
      setLS(0);
      const lineLen = kick.lineLen;
      const leftEnd = cx - kick.w / 2 - kick.pad;
      const rightStart = cx + kick.w / 2 + kick.pad;
      ctx.fillStyle = GREEN;
      ctx.fillRect(leftEnd - lineLen, cy - lineH / 2, lineLen, lineH);
      ctx.fillRect(rightStart, cy - lineH / 2, lineLen, lineH);
      ctx.textAlign = align;
      y += kick.h + kickGap;
    }

    parts.forEach((p, i) => {
      ctx.font = `700 ${p.size}px ${FONT}`;
      const cy = y + p.h / 2;
      outlined(p.text, ax, cy, p.size);
      y += p.h;
      if (i < parts.length - 1 && !hasDiv(i)) {
        y += tightGap;
      } else if (i < parts.length - 1) {
        y += gap;
        ctx.fillStyle = GREEN;
        ctx.fillRect(divLeft, y, divW, lineH);
        y += lineH + gap;
      }
    });
  }

  function showError(msg) {
    statusEl.textContent = msg;
    if (!img) { empty.hidden = false; empty.textContent = msg; }
  }

  // 사진 디코딩: URL을 쓰지 않고 직접 읽고, 휴대폰 고해상도 사진은 안전한 크기로 줄임
  async function decode(file) {
    let source = null;
    if (window.createImageBitmap) {
      try { source = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { source = null; }
    }
    if (!source) {
      source = await new Promise((res, rej) => {
        const fr = new FileReader();
        fr.onerror = rej;
        fr.onload = () => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = fr.result; };
        fr.readAsDataURL(file);
      });
    }
    const w0 = source.naturalWidth || source.width, h0 = source.naturalHeight || source.height;
    if (!w0 || !h0) throw new Error('empty');
    const scale = Math.min(1, 4096 / Math.max(w0, h0), Math.sqrt(16e6 / (w0 * h0)));
    const c = document.createElement('canvas');
    c.width = Math.round(w0 * scale); c.height = Math.round(h0 * scale);
    c.getContext('2d').drawImage(source, 0, 0, c.width, c.height);
    if (source.close) source.close();
    return c;
  }

  function loadFile(file) {
    if (!file) return;
    if (file.type && !file.type.startsWith('image/')) { showError('이미지 파일만 올릴 수 있어요.'); return; }
    fileBase = (file.name || 'photo').replace(/\.[^.]+$/, '') || 'photo';
    statusEl.textContent = '사진 불러오는 중…';
    if (!img) { empty.hidden = false; empty.textContent = '사진 불러오는 중…'; }
    const slow = setTimeout(() => { if (!img) showError('사진을 불러오는 데 오래 걸리고 있어요. 다른 사진으로 시도하거나 다른 브라우저에서 열어주세요.'); }, 10000);
    decode(file).then(src => {
      clearTimeout(slow);
      img = src;
      empty.hidden = true; cv.hidden = false; hint.hidden = false;
      const dl = typeof downloads === 'undefined' ? true : !!downloads;
      saveBtn.disabled = !dl;
      if (dl) statusEl.textContent = '';
      else statusEl.textContent = '이 화면에서는 저장 버튼을 쓸 수 없어요. 미리보기 이미지를 길게 누르거나 우클릭해서 저장해 주세요.';
      fontsReady.then(draw);
    }).catch(() => {
      clearTimeout(slow);
      const heic = /\.hei[cf]$/i.test(file.name || '') || /hei[cf]/i.test(file.type || '');
      showError(heic
        ? 'HEIC 형식 사진은 이 브라우저에서 열 수 없어요. JPG로 저장된 사진을 고르거나, 다른 브라우저(사파리 등)에서 열어주세요.'
        : '이 사진을 열 수 없어요. 다른 사진으로 시도해 주세요.');
    });
  }

  $('pick').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); }
  });
  let lastPicked = null;
  const onPick = e => {
    const f = e.target.files && e.target.files[0];
    if (!f || f === lastPicked) return;
    lastPicked = f;
    loadFile(f);
    setTimeout(() => { e.target.value = ''; }, 0);
  };
  $('file').addEventListener('change', onPick);
  $('file').addEventListener('input', onPick);

  // 추가 이미지
  $('ovpick').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('ovfile').click(); }
  });
  let lastOv = null;
  const onOvPick = e => {
    const f = e.target.files && e.target.files[0];
    if (!f || f === lastOv) return;
    lastOv = f;
    setTimeout(() => { e.target.value = ''; }, 0);
    if (f.type && !f.type.startsWith('image/')) { statusEl.textContent = '이미지 파일만 추가할 수 있어요.'; return; }
    decode(f).then(c => {
      overlay = c; ov = { ...OV_DEFAULT };
      $('ovctl').hidden = false;
      $('ovpick').textContent = '다른 이미지로 바꾸기';
      draw();
    }).catch(() => { statusEl.textContent = '추가할 이미지를 열 수 없어요. 다른 파일로 시도해 주세요.'; });
  };
  $('ovfile').addEventListener('change', onOvPick);
  $('ovfile').addEventListener('input', onOvPick);
  $('ovsize').addEventListener('input', () => { $('ovSizeOut').textContent = $('ovsize').value + '%'; draw(); });
  $('ovreset').addEventListener('click', () => { ov = { ...OV_DEFAULT }; draw(); });
  $('ovremove').addEventListener('click', () => {
    overlay = null; lastOv = null;
    $('ovctl').hidden = true;
    $('ovpick').textContent = '이미지 추가';
    draw();
  });

  ['dragenter', 'dragover'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => stage.addEventListener(ev, e => { e.preventDefault(); stage.classList.remove('over'); }));
  stage.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));
  document.addEventListener('paste', e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith('image/'));
    if (item) loadFile(item.getAsFile());
  });

  Object.values(fields).forEach(f => f.addEventListener('input', draw));

  function syncY() {
    yEl.value = Math.round(pos.y * 100);
    const v = pos.y;
    $('yOut').textContent = v > 0.8 ? '하단' : v < 0.35 ? '상단' : '중간';
  }
  sizeEl.addEventListener('input', () => { $('sizeOut').textContent = sizeEl.value + '%'; draw(); });
  yEl.addEventListener('input', () => { pos.y = yEl.value / 100; syncY(); draw(); });

  document.querySelectorAll('[data-align]').forEach(b => b.addEventListener('click', () => {
    align = b.dataset.align;
    document.querySelectorAll('[data-align]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    pos.x = align === 'left' ? 0 : align === 'right' ? 1 : 0.5;
    draw();
  }));

  $('reset').addEventListener('click', () => {
    pos = { ...DEFAULT };
    align = 'center';
    document.querySelectorAll('[data-align]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.align === 'center')));
    syncY(); draw();
  });

  // drag to move
  let drag = null;
  cv.addEventListener('pointerdown', e => {
    if (!img) return;
    cv.setPointerCapture(e.pointerId);
    cv.classList.add('dragging');
    const r = cv.getBoundingClientRect();
    const cx = (e.clientX - r.left) / r.width * cv.width;
    const cy = (e.clientY - r.top) / r.height * cv.height;
    const onOv = ovRect && cx >= ovRect.x && cx <= ovRect.x + ovRect.w && cy >= ovRect.y && cy <= ovRect.y + ovRect.h;
    if (onOv) {
      // 화면에 보이는 위치에서 시작하도록 현재 위치로 맞춤
      ov.x = (ovRect.x + ovRect.w / 2) / cv.width;
      ov.y = ovRect.y / cv.height;
    }
    drag = { mode: onOv ? 'ov' : 'text', sx: e.clientX, sy: e.clientY,
      px: onOv ? ov.x : pos.x, py: onOv ? ov.y : pos.y, rw: r.width, rh: r.height };
  });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const nx = Math.min(1, Math.max(0, drag.px + (e.clientX - drag.sx) / drag.rw));
    const ny = Math.min(1, Math.max(0, drag.py + (e.clientY - drag.sy) / drag.rh));
    if (drag.mode === 'ov') { ov.x = nx; ov.y = ny; }
    else { pos.x = nx; pos.y = ny; syncY(); }
    draw();
  });
  const end = () => { drag = null; cv.classList.remove('dragging'); };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);

  // save (브라우저 기본 다운로드)
  saveBtn.addEventListener('click', () => {
    if (!img) return;
    cv.toBlob(blob => {
      if (!blob) { statusEl.textContent = '이미지를 만들지 못했어요. 다시 시도해 주세요.'; return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fileBase + '_문구.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      statusEl.textContent = '저장했어요.';
    }, 'image/png');
  });

  syncY();
})();
</script>
</body>
</html>
